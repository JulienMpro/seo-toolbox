  <script>
    (() => {
      'use strict';
      const tools = JSON.parse(document.getElementById('tools-data').textContent);
      const categories = ['analyzers','calculators','checkers','converters','generators','geo','links','misc','schema','serp','strategy'];
      const colors = {analyzers:'#a78bfa',calculators:'#22d3ee',checkers:'#34d399',converters:'#fbbf24',generators:'#fb7185',geo:'#2dd4bf',links:'#60a5fa',misc:'#c084fc',schema:'#f472b6',serp:'#f97316',strategy:'#84cc16'};
      const labels = {analyzers:'Analyseurs',calculators:'Calculateurs',checkers:'Vérificateurs',converters:'Convertisseurs',generators:'Générateurs',geo:'Géo',links:'Liens',misc:'Divers',schema:'Schéma',serp:'SERP',strategy:'Stratégie'};
      const byId = id => document.getElementById(id);
      const grid = byId('grid'), search = byId('search'), chips = byId('chips'), modal = byId('modal');
      let activeCategory = 'all', lastFocus = null;
      const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      const escapeHTML = value => String(value ?? '').replace(/[&<>"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
      tools.sort((a,b) => categories.indexOf(a.category)-categories.indexOf(b.category) || a.name.localeCompare(b.name,'fr'));
      const counts = Object.fromEntries(categories.map(category => [category,tools.filter(tool => tool.category === category).length]));
      byId('stat-total').textContent = tools.length;
      byId('stat-categories').textContent = categories.length;
      byId('stat-with-args').textContent = tools.filter(tool => tool.args.length).length;
      byId('stat-without-args').textContent = tools.filter(tool => !tool.args.length).length;

      function buildChips(){
        const entries = [['all','Toutes',tools.length],...categories.map(category => [category,labels[category],counts[category]])];
        chips.innerHTML = entries.map(([key,label,count]) => `<button type="button" class="chip${key === activeCategory ? ' active' : ''}" data-category="${key}">${label} · ${count}</button>`).join('');
      }
      function render(){
        const query = normalize(search.value.trim());
        const visible = tools.filter(tool => (activeCategory === 'all' || tool.category === activeCategory) && (!query || normalize([tool.name,tool.description,...tool.args.map(arg => arg.name)].join(' ')).includes(query)));
        byId('results').textContent = `${visible.length} outil${visible.length > 1 ? 's' : ''} affiché${visible.length > 1 ? 's' : ''}`;
        grid.innerHTML = visible.length ? visible.map(tool => {
          const index = tools.indexOf(tool), argText = tool.args.length ? `⚙️ ${tool.args.length} arg${tool.args.length > 1 ? 's' : ''}` : '🎯 sans argument';
          return `<article class="card" tabindex="0" role="button" aria-label="Voir ${escapeHTML(tool.name)}" data-index="${index}"><div class="card-inner"><span class="category" style="--cat:${colors[tool.category]}">${escapeHTML(labels[tool.category])}</span><h2>${escapeHTML(tool.name)}</h2><p class="description">${escapeHTML(tool.description)}</p><div class="meta"><span class="pill">${argText}</span><span class="pill">${tool.returns === 'table' ? '📊 table' : '📝 texte'}</span></div></div></article>`;
        }).join('') : '<div class="empty">Aucun outil ne correspond à cette recherche.</div>';
      }
      function exampleValue(arg){
        if(arg.is_flag) return '';
        const help = String(arg.help || '').trim().replace(/\s+/g,' ');
        return help ? help.slice(0,12).trim() : 'valeur';
      }
      function openModal(tool, trigger){
        lastFocus = trigger;
        const category = byId('modal-category');
        category.textContent = labels[tool.category]; category.style.setProperty('--cat',colors[tool.category]);
        byId('modal-title').textContent = tool.name; byId('modal-description').textContent = tool.description;
        byId('arguments').innerHTML = tool.args.length ? `<div class="table-wrap"><table><thead><tr><th>Nom</th><th>Requis</th><th>Défaut</th><th>Aide</th></tr></thead><tbody>${tool.args.map(arg => `<tr><td><code>--${escapeHTML(arg.name)}</code></td><td><span class="required ${arg.required ? 'yes' : 'no'}">${arg.required ? 'oui' : 'non'}</span></td><td>${arg.default === null || arg.default === '' ? '—' : escapeHTML(arg.default)}</td><td>${escapeHTML(arg.help || '—')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="no-args">Aucun argument — outil sans paramètre.</div>';
        const required = tool.args.filter(arg => arg.required).map(arg => `--${arg.name}${arg.is_flag ? '' : ` ${exampleValue(arg)}`}`);
        byId('example').textContent = ['seo tool',tool.name,...required].join(' ');
        modal.classList.add('open'); document.body.style.overflow = 'hidden'; byId('close-modal').focus();
      }
      function closeModal(){modal.classList.remove('open');document.body.style.overflow='';if(lastFocus)lastFocus.focus()}
      chips.addEventListener('click', event => {const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;buildChips();render()});
      search.addEventListener('input',render);
      grid.addEventListener('click',event=>{const card=event.target.closest('.card');if(card)openModal(tools[Number(card.dataset.index)],card)});
      grid.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('card')){event.preventDefault();openModal(tools[Number(event.target.dataset.index)],event.target)}});
      byId('close-modal').addEventListener('click',closeModal);
      modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal.classList.contains('open'))closeModal()});
      buildChips(); render();
    })();
  </script>
