{% extends "base.html" %}
{% block title %}165 SEO Mini-Tools · SEO Toolbox{% endblock %}
{% block content %}
<style>
  .tools-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
  .tool-count { color:var(--muted); white-space:nowrap; }
  .tool-controls { position:sticky; top:10px; z-index:10; padding:16px; margin-bottom:22px; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); }
  .tool-search { width:100%!important; max-width:none; }
  .tool-chips { display:flex; gap:8px; margin-top:13px; overflow-x:auto; }
  .tool-chip { flex:none; height:34px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:#475467; font-size:13px; font-weight:650; }
  .tool-chip:hover,.tool-chip.active { border-color:var(--brand); background:var(--brand); color:#fff; }
  .tools-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .tool-card { min-height:175px; text-align:left; height:auto; padding:18px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:var(--radius); font-weight:400; }
  .tool-card:hover,.tool-card:focus-visible { background:#fff; border-color:#75aaa5; transform:translateY(-2px); }
  .tool-card h2 { margin:13px 0 7px; font-size:17px; overflow-wrap:anywhere; }
  .tool-card p { margin:0; color:var(--muted); }
  .tool-category { display:inline-block; padding:3px 8px; color:var(--brand-dark); background:#e7f5f3; border-radius:999px; font-size:11px; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
  .tools-empty { grid-column:1/-1; }
  .tool-modal { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(15,23,42,.62); }
  .tool-modal.open { display:flex; }
  .tool-dialog { width:min(850px,100%); max-height:88vh; overflow:auto; padding:24px; background:#fff; border-radius:14px; box-shadow:0 24px 70px rgba(15,23,42,.3); }
  .tool-dialog-head { display:flex; justify-content:space-between; gap:20px; }
  .tool-dialog h2 { margin:10px 0 8px; overflow-wrap:anywhere; }
  .tool-close { width:38px; height:38px; padding:0; background:#eef2f6; color:var(--ink); }
  .tool-close:hover { background:#e2e8f0; }
  .tool-description { color:#475467; }
  .tool-dialog h3 { margin:23px 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; }
  .required { font-weight:700; color:var(--danger); }
  .optional { color:var(--muted); }
  .tool-command { padding:14px; border-radius:8px; color:#d5faf5; background:#13212d; white-space:pre-wrap; overflow-wrap:anywhere; }
  @media(max-width:600px) { .tools-head { align-items:start; flex-direction:column; } .tool-controls { position:static; } }
</style>
<div class="tools-head"><div><h1>165 SEO Mini-Tools</h1><p class="lede">Browse every focused tool in the Python registry.</p></div><div class="tool-count" id="tool-results" aria-live="polite">{{ tools|length }} tools</div></div>
<section class="panel tool-controls" aria-label="Tool filters">
  <label for="tool-search">Search tools</label><input class="tool-search" id="tool-search" type="search" placeholder="Search by name or description…" autocomplete="off">
  <div class="tool-chips" id="tool-chips"><button class="tool-chip active" type="button" data-category="all">All ({{ tools|length }})</button>{% for category in categories %}<button class="tool-chip" type="button" data-category="{{ category.name }}">{{ category.name|capitalize }} ({{ category.count }})</button>{% endfor %}</div>
</section>
<section class="tools-grid" id="tools-grid" aria-live="polite"></section>
<div class="tool-modal" id="tool-modal" role="dialog" aria-modal="true" aria-labelledby="tool-modal-title"><article class="tool-dialog"><div class="tool-dialog-head"><div><span class="tool-category" id="tool-modal-category"></span><h2 id="tool-modal-title"></h2></div><button class="tool-close" id="tool-close" type="button" aria-label="Close">✕</button></div><p class="tool-description" id="tool-modal-description"></p><h3>Arguments</h3><div id="tool-arguments"></div><h3>Example command</h3><pre class="tool-command"><code id="tool-example"></code></pre></article></div>
<script id="tools-data" type="application/json">{{ tools|tojson }}</script>
<script>
(() => {
  const tools = JSON.parse(document.getElementById('tools-data').textContent);
  const grid = document.getElementById('tools-grid');
  const search = document.getElementById('tool-search');
  const results = document.getElementById('tool-results');
  const modal = document.getElementById('tool-modal');
  let category = 'all';
  const escapeHtml = value => { const node = document.createElement('div'); node.textContent = value ?? ''; return node.innerHTML; };
  function render() {
    const query = search.value.trim().toLowerCase();
    const visible = tools.filter(tool => (category === 'all' || tool.category === category) && (`${tool.name} ${tool.description}`).toLowerCase().includes(query));
    results.textContent = `${visible.length} tool${visible.length === 1 ? '' : 's'}`;
    grid.innerHTML = visible.length ? visible.map(tool => `<button type="button" class="tool-card" data-tool="${escapeHtml(tool.name)}"><span class="tool-category">${escapeHtml(tool.category)}</span><h2>${escapeHtml(tool.name)}</h2><p>${escapeHtml(tool.description)}</p></button>`).join('') : '<div class="empty tools-empty">No tools match these filters.</div>';
  }
  function openTool(name) {
    const tool = tools.find(item => item.name === name); if (!tool) return;
    document.getElementById('tool-modal-category').textContent = tool.category;
    document.getElementById('tool-modal-title').textContent = tool.name;
    document.getElementById('tool-modal-description').textContent = tool.description;
    document.getElementById('tool-arguments').innerHTML = tool.args.length ? `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Required</th><th>Default</th><th>Help</th></tr></thead><tbody>${tool.args.map(arg => `<tr><td>${escapeHtml(arg.name)}</td><td class="${arg.required ? 'required' : 'optional'}">${arg.required ? 'Yes' : 'No'}</td><td>${escapeHtml(arg.default ?? 'N/D')}</td><td>${escapeHtml(arg.help || 'N/D')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">This tool has no arguments.</div>';
    const required = tool.args.filter(arg => arg.required).map(arg => ` --${arg.name}${arg.is_flag ? '' : ` ${arg.help ? arg.help.slice(0, 12) : 'value'}`}`).join('');
    document.getElementById('tool-example').textContent = `seo tool ${tool.name}${required}`;
    modal.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; }
  document.getElementById('tool-chips').addEventListener('click', event => { const chip = event.target.closest('[data-category]'); if (!chip) return; category = chip.dataset.category; document.querySelectorAll('.tool-chip').forEach(item => item.classList.toggle('active', item === chip)); history.replaceState(null, '', category === 'all' ? '/tools' : `#${category}`); render(); });
  grid.addEventListener('click', event => { const card = event.target.closest('[data-tool]'); if (card) openTool(card.dataset.tool); });
  search.addEventListener('input', render); document.getElementById('tool-close').addEventListener('click', closeModal);
  modal.addEventListener('click', event => { if (event.target === modal) closeModal(); }); document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
  const initial = decodeURIComponent(location.hash.slice(1)); const chip = document.querySelector(`[data-category="${CSS.escape(initial)}"]`); if (chip) chip.click(); else render();
})();
</script>
{% endblock %}
