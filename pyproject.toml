[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-toolbox"
version = "0.6.0"
description = "165 mini-outils SEO pour consultants : keyword research, rank tracking, backlinks, SERP, audit technique, GEO/IA — propulsé par DataForSEO (CLI Typer + API FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Julien Mouttet", email = "julienmouttet.pro@gmail.com"},
]
license = {file = "LICENSE"}
keywords = ["seo", "dataforseo", "keyword-research", "rank-tracking", "backlinks", "serp", "geo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/JulienMpro/seo-toolbox"
Repository = "https://github.com/JulienMpro/seo-toolbox"
Issues = "https://github.com/JulienMpro/seo-toolbox/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
web = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]

[project.scripts]
seo = "seotoolbox.cli:app"

[tool.setuptools.packages.find]
include = ["seotoolbox*", "api*"]

[tool.setuptools.package-data]
api = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
