[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seotoolbox"
version = "0.5.0"
description = "A pay-per-request SEO research CLI powered by DataForSEO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
seo = "seotoolbox.cli:app"

[tool.setuptools.packages.find]
include = ["seotoolbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
